<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Herbal Bliss</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo"><a href="index.html"><h1>Herbal Bliss</h1></a></div>
                <div class="nav-icons">
                    <a href="cart.html"><i class="fas fa-shopping-cart"></i><span id="cart-count">0</span></a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="cart-section" style="padding: 60px 0;">
            <h1>Shopping Cart</h1>
            <div id="cart-container" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 30px;">
                <div id="cart-items">
                    <!-- Loaded via JS -->
                    <p>Your cart is empty.</p>
                </div>
                <div id="cart-summary" class="auth-container" style="text-align: left; height: fit-content;">
                    <h3>Order Summary</h3>
                    <div style="display: flex; justify-content: space-between; margin: 20px 0;">
                        <span>Subtotal</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <a href="checkout.html" id="checkout-btn" class="btn btn-full" style="display: none;">Proceed to Checkout</a>
                    <a href="shop.html" class="btn btn-full btn-outline" style="margin-top: 10px;">Continue Shopping</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCart);

        function loadCart() {
            fetch('../Backend/api/getCart.php')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('cart-items');
                    const totalEl = document.getElementById('cart-total');
                    const checkoutBtn = document.getElementById('checkout-btn');

                    if (data.items.length > 0) {
                        container.innerHTML = data.items.map(item => `
                            <div class="cart-item" style="display: flex; align-items: center; gap: 20px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 20px;">
                                <img src="images/${item.image}" width="80" style="border-radius: 5px;">
                                <div style="flex-grow: 1;">
                                    <h3>${item.name}</h3>
                                    <p>$${item.price}</p>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <button onclick="updateQty(${item.id}, ${item.quantity - 1})" class="btn-icon">-</button>
                                    <span>${item.quantity}</span>
                                    <button onclick="updateQty(${item.id}, ${item.quantity + 1})" class="btn-icon">+</button>
                                </div>
                                <button onclick="removeItem(${item.id})" class="text-danger" style="background: none; border: none; cursor: pointer;"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('');
                        totalEl.innerText = `$${data.total.toFixed(2)}`;
                        checkoutBtn.style.display = 'block';
                    } else {
                        container.innerHTML = '<p>Your cart is empty.</p>';
                        totalEl.innerText = '$0.00';
                        checkoutBtn.style.display = 'none';
                    }
                });
        }

        function updateQty(id, qty) {
            fetch('../Backend/api/updateCart.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, quantity: qty })
            }).then(() => {
                loadCart();
                updateCartCount();
            });
        }

        function removeItem(id) {
            fetch('../Backend/api/updateCart.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, action: 'remove' })
            }).then(() => {
                loadCart();
                updateCartCount();
            });
        }
    </script>
</body>
</html>
